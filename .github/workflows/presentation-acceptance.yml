name: Theme and presentation acceptance
on:
  push:
    branches: [review/theme-presentation-acceptance-v1]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      GAGA_CONTENT_RELEASE_ENABLED: 'false'
      APPLICATION_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: application
          ref: ${{ env.APPLICATION_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: proof
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Exact source and clean locked runtime
        working-directory: application
        run: |
          npm install --global npm@10.9.3 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = v22.23.4
          test "$(npm --version)" = 10.9.3
          test "$(git rev-parse HEAD)" = "$APPLICATION_REF"
          mkdir -p "$RUNNER_TEMP/presentation"
          echo "GAGA_EVIDENCE_DIRECTORY=$RUNNER_TEMP/presentation" >> "$GITHUB_ENV"
          echo "GAGA_APPLICATION_DIR=$PWD" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import{writeFileSync}from'node:fs';import{execFileSync}from'node:child_process';
          writeFileSync(process.env.RUNNER_TEMP+'/presentation/runtime.json',JSON.stringify({node:process.version,npm:execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),image:process.env.ImageOS,imageVersion:process.env.ImageVersion,application:process.env.APPLICATION_REF,proof:process.env.GITHUB_SHA},null,2));
          JS
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the exact admitted review source for isolated browser proof
        id: build
        working-directory: application
        run: |
          export PUBLIC_GIT_SHA="$APPLICATION_REF"
          export PUBLIC_BUILD_TIME="$(git show -s --format=%cI HEAD)"
          npm run build > "$GAGA_EVIDENCE_DIRECTORY/build.log" 2>&1
          npx --no-install playwright install --with-deps chromium
      - name: Focused regression for the confirmed application-only P1 corrections
        working-directory: application
        run: |
          npm run test:gaga | tee "$GAGA_EVIDENCE_DIRECTORY/gaga-tests.log"
          node --test tools/contextual/*.test.mjs tools/editorial/semantics-boundary.test.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/regression.log"
          npm test | tee "$GAGA_EVIDENCE_DIRECTORY/hardening.log"
          npm run check | tee "$GAGA_EVIDENCE_DIRECTORY/types.log"
          python3 tools/contextual/metadata-proof.py
          npm run test:ui | tee "$GAGA_EVIDENCE_DIRECTORY/mandatory-browser.log"
          node tools/gaga/browser-contract.mjs --report .gaga/browser-results.json
          cp .gaga/browser-results.json "$GAGA_EVIDENCE_DIRECTORY/mandatory-browser.json"
          npx --no-install playwright test --config playwright.contextual.config.ts | tee "$GAGA_EVIDENCE_DIRECTORY/contextual-browser.log"
          cp -R .gaga/contextual-ux "$GAGA_EVIDENCE_DIRECTORY/contextual-ux"
          npm audit --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/audit.json"
      - name: Complete theme by viewport acceptance matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: application
        run: node node_modules/@playwright/test/cli.js test --config "$GITHUB_WORKSPACE/proof/tools/presentation/playwright.config.mjs" | tee "$GAGA_EVIDENCE_DIRECTORY/browser.log"
      - name: Preserve diagnostics even when a regression rejects the candidate
        if: always()
        working-directory: application
        run: |
          if [ -d .gaga/contextual-ux ]; then cp -R .gaga/contextual-ux "$GAGA_EVIDENCE_DIRECTORY/"; fi
      - name: Source preservation and workflow lint
        if: always()
        working-directory: application
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          node --input-type=module <<'JS'
          import{writeFileSync}from'node:fs';import{sourceIdentity}from'./tools/gaga/source-identity.mjs';
          writeFileSync(process.env.GAGA_EVIDENCE_DIRECTORY+'/application-source.json',JSON.stringify(sourceIdentity(),null,2));
          JS
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= ../proof/.github/workflows/presentation-acceptance.yml
      - name: Exact acceptance receipt and preserved authority boundaries
        working-directory: application
        run: |
          node --input-type=module <<'JS'
          import assert from'node:assert/strict';import{readFileSync,writeFileSync}from'node:fs';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';
          const dir=process.env.GAGA_EVIDENCE_DIRECTORY,read=p=>JSON.parse(readFileSync(p)),stats=read(dir+'/browser-results.json').stats,mandatory=read(dir+'/mandatory-browser.json').stats,contextual=read(dir+'/contextual-ux/browser-results.json').stats;
          for(const [s,count] of [[stats,40],[mandatory,10],[contextual,20]]){assert.equal(s.expected,count);for(const field of ['unexpected','skipped','flaky'])assert.equal(s[field],0);}
          const base='7ca9f5708fd92fab50e3ba689fe3a011adaf07ad';
          execFileSync('git',['diff','--exit-code',base,'HEAD','--','cms','editorial','content','package.json','package-lock.json','gaga.app.json','wrangler.jsonc','vendor','content-release.json','tools/gaga/preservation.mjs','docs/UI-PRESERVATION.json','.github/workflows/deploy.yml','.github/workflows/content-release.yml','.github/workflows/content-publish.yml']);
          const hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');assert.equal(hash('dist/search-index.json'),'baee3af23ce389f90c49d3825f009d5a8963e5a4356465c9a6d6ee4573dbbccf');assert.equal(read(dir+'/audit.json').metadata.vulnerabilities.total,0);
          writeFileSync(dir+'/qualification-receipt.json',JSON.stringify({status:'QUALIFIED',application:read(dir+'/application-source.json'),proof:process.env.GITHUB_SHA,runtime:read(dir+'/runtime.json'),workerd:execFileSync('node_modules/.bin/workerd',['--version'],{encoding:'utf8'}).trim(),acceptance:stats,mandatory,contextual,searchSha256:hash('dist/search-index.json'),audit:read(dir+'/audit.json').metadata.vulnerabilities,reused:{cmsAndSharedRenderer:'40866139496; exact bytes unchanged',referenceSemantics:'40866139496; shell/DOM/styles unchanged; native focus and new Outline covered freshly'},productionMutations:0,mainPromotions:0,deployments:0,run:process.env.GITHUB_RUN_ID},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: presentation-acceptance-evidence
          path: ${{ runner.temp }}/presentation
          if-no-files-found: error
