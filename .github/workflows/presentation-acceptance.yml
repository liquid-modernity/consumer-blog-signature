name: Contextual design polish V2 qualification
on:
  push:
    branches: [review/theme-presentation-acceptance-v1]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      GAGA_CONTENT_RELEASE_ENABLED: 'false'
      PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Exact runtime, locked dependencies and external evidence
        run: |
          npm install --global npm@10.9.3 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = v22.23.4
          test "$(npm --version)" = 10.9.3
          mkdir -p "$RUNNER_TEMP/polish-v2"
          echo "GAGA_EVIDENCE_DIRECTORY=$RUNNER_TEMP/polish-v2" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import{writeFileSync}from'node:fs';import{execFileSync}from'node:child_process';
          writeFileSync(process.env.RUNNER_TEMP+'/polish-v2/runtime.json',JSON.stringify({node:process.version,npm:execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),image:process.env.ImageOS,imageVersion:process.env.ImageVersion,source:process.env.GITHUB_SHA}));
          JS
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Affected regressions, public semantics and unchanged CMS contracts
        run: |
          node tools/gaga/prepare.mjs
          npm run test:gaga | tee "$GAGA_EVIDENCE_DIRECTORY/gaga-tests.log"
          npm run test:cms | tee "$GAGA_EVIDENCE_DIRECTORY/cms-tests.log"
          node --test tools/contextual/*.test.mjs tools/editorial/semantics-boundary.test.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/regression.log"
          npm test | tee "$GAGA_EVIDENCE_DIRECTORY/hardening.log"
      - name: Application and CMS typing, build, metadata and native integrations
        run: |
          npm run check | tee "$GAGA_EVIDENCE_DIRECTORY/types.log"
          node node_modules/typescript/bin/tsc --project cms/tsconfig.json --noEmit
          export PUBLIC_BUILD_TIME="$(git show -s --format=%cI HEAD)"
          npm run build | tee "$GAGA_EVIDENCE_DIRECTORY/build.log"
          python3 tools/contextual/metadata-proof.py
          python3 tools/reference/html-semantics.py
          npm run test:consumer | tee "$GAGA_EVIDENCE_DIRECTORY/consumer.log"
      - run: npx --no-install playwright install --with-deps chromium
      - name: Chromium stale-source reproduction and read-only rollback confirmation
        run: node tools/gaga/browser-source-proof.mjs 81d6426e3e85fd726fa22dc03236023ae042c08bffcacd9ddb243df34bdb7d1d > "$GAGA_EVIDENCE_DIRECTORY/browser-source-proof.json"
      - name: Preserve all ten mandatory browser cases and security assertions
        run: |
          npm run test:ui | tee "$GAGA_EVIDENCE_DIRECTORY/mandatory-browser.log"
          node tools/gaga/browser-contract.mjs --report .gaga/browser-results.json
      - name: Focused V2 interaction and responsive qualification
        run: npx --no-install playwright test --config tools/polish/playwright.config.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/polish-browser.log"
      - name: Audit, workflow lint and exact source evidence
        run: |
          npm audit --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/audit.json"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/presentation-acceptance.yml
          git diff --exit-code 93b7c9617a2055543958852fd39205cb3aa0aac7 HEAD -- cms editorial content package.json package-lock.json gaga.app.json wrangler.jsonc vendor content-release.json .github/workflows/deploy.yml .github/workflows/content-release.yml .github/workflows/content-publish.yml tools/gaga/browser
          node --input-type=module <<'JS'
          import assert from'node:assert/strict';import{readFileSync,writeFileSync}from'node:fs';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';import{sourceIdentity}from'./tools/gaga/source-identity.mjs';import{assertBrowserReport}from'./tools/gaga/browser-contract.mjs';
          const dir=process.env.GAGA_EVIDENCE_DIRECTORY,read=p=>JSON.parse(readFileSync(p)),stats=read('.gaga/polish-v2/browser-results.json').stats;
          assert.equal(stats.expected,16);for(const k of ['unexpected','skipped','flaky'])assert.equal(stats[k],0);
          const search=createHash('sha256').update(readFileSync('dist/search-index.json')).digest('hex');assert.equal(search,'baee3af23ce389f90c49d3825f009d5a8963e5a4356465c9a6d6ee4573dbbccf');assert.equal(read(dir+'/audit.json').metadata.vulnerabilities.total,0);
          writeFileSync(dir+'/qualification-receipt.json',JSON.stringify({status:'QUALIFIED',source:sourceIdentity(),runtime:read(dir+'/runtime.json'),workerd:execFileSync('node_modules/.bin/workerd',['--version'],{encoding:'utf8'}).trim(),mandatory:assertBrowserReport(read('.gaga/browser-results.json')),polish:stats,searchSha256:search,audit:read(dir+'/audit.json').metadata.vulnerabilities,run:process.env.GITHUB_RUN_ID,productionMutations:0},null,2));
          JS
      - name: Preserve diagnostics and actual captures
        if: always()
        run: |
          if [ -d .gaga/polish-v2 ]; then cp -R .gaga/polish-v2 "$GAGA_EVIDENCE_DIRECTORY/"; fi
          if [ -d test-results ]; then cp -R test-results "$GAGA_EVIDENCE_DIRECTORY/"; fi
          if [ -f .gaga/browser-results.json ]; then cp .gaga/browser-results.json "$GAGA_EVIDENCE_DIRECTORY/"; fi
          if [ -d .gaga/contextual-ux ]; then cp -R .gaga/contextual-ux "$GAGA_EVIDENCE_DIRECTORY/"; fi
          if [ -d .gaga/reference-quality ]; then cp -R .gaga/reference-quality "$GAGA_EVIDENCE_DIRECTORY/"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contextual-design-polish-v2
          path: ${{ runner.temp }}/polish-v2
          if-no-files-found: error
