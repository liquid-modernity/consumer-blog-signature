name: Rich Editorial Studio
on:
  push:
    branches: [review/rich-editorial-studio-v1]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: qualify
        options: [current-actor-check, qualify, admission-check, preview-check, production-preflight, production-backup, deploy-cms]
      qualification_run:
        type: string
        description: Exact successful qualification run for CMS upload
      artifact_id:
        type: string
        description: Optional immutable prequalified CMS artifact ID
      artifact_sha256:
        type: string
        description: Exact prequalified ZIP digest, required with artifact_id
      artifact_source:
        type: string
        description: Immutable CMS source commit, required with artifact_id
      expected_state:
        type: string
        description: Exact CMS/publication versions and optional cmsSecretBindings metadata as JSON
      freeze_confirmed:
        type: boolean
        default: false
        description: Operator edits paused and production workflows frozen
permissions:
  contents: read
concurrency:
  group: editorial-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  current-actor:
    if: inputs.operation == 'current-actor-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_USER: emdash_test
          POSTGRES_DB: emdash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      GAGA_CONTENT_RELEASE_ENABLED: "false"
      EMDASH_TEST_PG: postgres://emdash_test:isolated-test-only@localhost:5432/emdash_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: emdash-cms/emdash
          ref: 0409cd220949d7f8ea4856b2f49b75e99c2b4119
          path: native-host
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - name: Exact upstream source and patch input, no production credentials
        run: |
          mkdir -p "$RUNNER_TEMP/current-actor-evidence"
          echo "GAGA_EVIDENCE_DIRECTORY=$RUNNER_TEMP/current-actor-evidence" >> "$GITHUB_ENV"
          echo "GAGA_AUTH_APPLICATION=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "GAGA_AUTH_EVIDENCE=$RUNNER_TEMP/current-actor-evidence/delayed-apply.jsonl" >> "$GITHUB_ENV"
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import assert from 'node:assert/strict';
          const pin=JSON.parse(readFileSync('tools/content/current-actor-proof/upstream.json'));
          assert.equal(pin.baseline,'0409cd220949d7f8ea4856b2f49b75e99c2b4119');
          const packed=readFileSync('tools/content/current-actor-proof/upstream.patch.gz');
          assert.equal(createHash('sha256').update(packed).digest('hex'),pin.compressedPatchSha256);
          assert.equal(createHash('sha256').update(gunzipSync(packed)).digest('hex'),pin.patchSha256);
          JS
          test "$(git -C native-host rev-parse HEAD)" = 0409cd220949d7f8ea4856b2f49b75e99c2b4119
          gzip -dc tools/content/current-actor-proof/upstream.patch.gz | git -C native-host apply --check
          gzip -dc tools/content/current-actor-proof/upstream.patch.gz | git -C native-host apply
          cp tools/content/current-actor-proof/upstream.json "$RUNNER_TEMP/current-actor-evidence/"
      - name: Clean locked installation and exact runtime record
        run: |
          test "$(node --version)" = v22.23.4
          [[ "$(npm --version)" == 10.* ]]
          { echo "ImageOS=$ImageOS"; echo "ImageVersion=$ImageVersion"; uname -a; node --version; npm --version; pnpm --version; } > "$GAGA_EVIDENCE_DIRECTORY/runtime.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          cd native-host
          pnpm install --frozen-lockfile > "$GAGA_EVIDENCE_DIRECTORY/install.log" 2>&1
          find node_modules/.pnpm -path '*/workerd/bin/workerd' -type f -exec {} --version \; >> "$GAGA_EVIDENCE_DIRECTORY/runtime.txt"
      - name: Required upstream formatting
        working-directory: native-host
        run: pnpm format > "$GAGA_EVIDENCE_DIRECTORY/format.log" 2>&1
      - name: Required upstream workspace build
        id: native-build
        working-directory: native-host
        run: pnpm build > "$GAGA_EVIDENCE_DIRECTORY/build.log" 2>&1
      - name: Upstream package and component declarations
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm typecheck > "$GAGA_EVIDENCE_DIRECTORY/typecheck.log" 2>&1
      - name: Upstream quick lint
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm lint:quick > "$GAGA_EVIDENCE_DIRECTORY/lint-quick.json" 2>&1
      - name: Upstream type-aware lint
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --silent lint:json > "$GAGA_EVIDENCE_DIRECTORY/lint.json" 2>&1
      - name: Public capability and consent regressions
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter @emdash-cms/plugin-types test > "$GAGA_EVIDENCE_DIRECTORY/plugin-types.log" 2>&1
      - name: Native RBAC regressions
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter @emdash-cms/auth exec vitest run > "$GAGA_EVIDENCE_DIRECTORY/auth.log" 2>&1
      - name: Current authorization and native route policy regressions
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter emdash exec vitest run tests/unit/plugins/authorization.test.ts tests/unit/plugins/capability-normalization.test.ts tests/unit/plugins/routes.test.ts tests/unit/plugins/content-policy.test.ts tests/unit/plugins/unpublish-hooks.test.ts > "$GAGA_EVIDENCE_DIRECTORY/native-authorization.log" 2>&1
      - name: Cloudflare provider and bridge regressions
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter @emdash-cms/cloudflare test > "$GAGA_EVIDENCE_DIRECTORY/cloudflare.log" 2>&1
      - name: Workerd bridge regressions
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter @emdash-cms/sandbox-workerd test > "$GAGA_EVIDENCE_DIRECTORY/workerd-bridge.log" 2>&1
      - name: Plugin CLI contract regressions
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter @emdash-cms/plugin-cli test > "$GAGA_EVIDENCE_DIRECTORY/plugin-cli.log" 2>&1
      - name: Exhaustive plugin contract fixture
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter @emdash-cms/plugin-test test > "$GAGA_EVIDENCE_DIRECTORY/plugin-test.log" 2>&1
      - name: Real local D1 and sandbox RPC parity
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --filter emdash exec vitest run --config vitest.workerd.config.ts tests/workerd/plugin-authorization.test.ts > "$GAGA_EVIDENCE_DIRECTORY/workerd-rpc.log" 2>&1
      - name: Public documentation build
        if: always() && steps.native-build.outcome == 'success'
        working-directory: native-host
        run: pnpm --dir docs build > "$GAGA_EVIDENCE_DIRECTORY/docs.log" 2>&1
      - name: Affected application regressions
        if: always() && steps.native-build.outcome == 'success'
        run: node --test tools/content/approval.test.mjs tools/content/content.test.mjs > "$GAGA_EVIDENCE_DIRECTORY/application-regressions.log" 2>&1
      - name: Actual application intent to native apply and revocation matrix
        if: always() && steps.native-build.outcome == 'success'
        run: |
          cp tools/content/current-actor.integration.test.ts native-host/packages/core/tests/integration/runtime/gaga-delayed-apply.test.ts
          cd native-host
          pnpm --filter emdash exec vitest run tests/integration/runtime/gaga-delayed-apply.test.ts > "$GAGA_EVIDENCE_DIRECTORY/gaga-delayed-apply.log" 2>&1
      - name: Workflow lint
        if: always()
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/editorial-studio.yml > "$GAGA_EVIDENCE_DIRECTORY/workflow-lint.log" 2>&1
      - name: Preserve exact qualified upstream diff and unchanged application locks
        if: always()
        run: |
          rm -f native-host/packages/core/tests/integration/runtime/gaga-delayed-apply.test.ts
          git -C native-host add -N .
          git -C native-host diff --binary > "$GAGA_EVIDENCE_DIRECTORY/qualified-upstream.patch"
          git -C native-host status --short > "$GAGA_EVIDENCE_DIRECTORY/upstream-status.txt"
          git -C native-host add -A
          git -C native-host write-tree > "$GAGA_EVIDENCE_DIRECTORY/upstream-tree.txt"
          sha256sum package-lock.json cms/package-lock.json tools/content/current-actor-proof/upstream.patch.gz > "$GAGA_EVIDENCE_DIRECTORY/identities.txt"
          git diff --exit-code -- package-lock.json cms/package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-actor-authorization-evidence
          path: ${{ runner.temp }}/current-actor-evidence
          if-no-files-found: error

  admission:
    if: inputs.operation == 'admission-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Only changed admission paths and existing zero-side-effect deployment guards
        run: node --test tools/cms/export.test.mjs tools/editorial/production-control.test.mjs tools/editorial/admission.test.mjs tools/gaga/production-deploy.test.mjs
      - name: Maintained deployment workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/deploy.yml .github/workflows/editorial-studio.yml
  preview:
    if: inputs.operation == 'preview-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Exact native revision capability, canonical preview and unchanged security boundaries
        run: node --test tools/content/content.test.mjs tools/editorial/plugin.test.mjs tools/editorial/boundaries.test.mjs
      - name: Strict CMS types
        run: node node_modules/typescript/bin/tsc --project cms/tsconfig.json --noEmit
      - name: Build the changed CMS once and prove compiled native startup without provider credentials
        env:
          GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/preview-qualification/evidence
        run: |
          mkdir -p "$RUNNER_TEMP/preview-qualification/evidence"
          npm run build:cloudflare --prefix cms > "$RUNNER_TEMP/preview-qualification/cms-build.log" 2>&1
          node tools/cms/runtime-proof.mjs
      - name: Maintained workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/editorial-studio.yml
      - name: Source unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        with:
          name: cms-worker-candidate
          path: cms/dist-cloudflare
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-qualification-evidence
          path: ${{ runner.temp }}/preview-qualification
  verify:
    if: github.event_name == 'push' || inputs.operation == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      ASTRO_DEV_BACKGROUND: "1"
      WRANGLER_SEND_METRICS: "false"
      PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Clean locked public dependencies; external evidence only
        run: |
          mkdir -p "$RUNNER_TEMP/editorial-evidence"
          printf 'GAGA_EVIDENCE_DIRECTORY=%s/editorial-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Official EmDash bytes and public extension boundary
        run: python3 tools/editorial/upstream-integrity.py | tee "$GAGA_EVIDENCE_DIRECTORY/upstream.log"
      - name: Rich model, boundary, CMS, GAGA and signature regressions
        run: |
          npm run test:editorial | tee "$GAGA_EVIDENCE_DIRECTORY/editorial-tests.log"
          npm run test:gaga | tee "$GAGA_EVIDENCE_DIRECTORY/gaga-tests.log"
          npm run test:cms | tee "$GAGA_EVIDENCE_DIRECTORY/cms-tests.log"
          npm test | tee "$GAGA_EVIDENCE_DIRECTORY/signature-tests.log"
          node tools/gaga/preservation.mjs
          node tools/gaga/boundaries.mjs
      - name: Deterministic conversion and native seed admission
        run: |
          npm run editorial:prepare
          cd cms
          node node_modules/emdash/dist/cli/index.mjs seed ../.gaga/editorial/seed.json --validate
      - name: Current production cutover plan admission
        run: node tools/editorial/cutover-plan.mjs
      - name: Strict application and CMS TypeScript
        run: |
          npx tsc --noEmit -p cms/tsconfig.json
          npm run check | tee "$GAGA_EVIDENCE_DIRECTORY/types.log"
      - name: Publication build and public-package Search/Starlight/workerd proof
        run: |
          PUBLIC_BUILD_TIME="$(git show -s --format=%cI HEAD)" npm run build | tee "$GAGA_EVIDENCE_DIRECTORY/build.log"
          npm run test:consumer | tee "$GAGA_EVIDENCE_DIRECTORY/consumer.log"
      - name: Native editor, persistence, media, revisions and real PAKRPP preview
        run: |
          npx playwright install --with-deps chromium
          npm run test:editorial:ui | tee "$GAGA_EVIDENCE_DIRECTORY/studio-browser.log"
          npm run test:ui | tee "$GAGA_EVIDENCE_DIRECTORY/blog-browser.log"
      - name: Compile CMS studio with Cloudflare adapter, no credentials or deployment
        working-directory: cms
        run: npx astro build --root ./studio --config ../astro.studio.cloudflare.config.mjs > "$GAGA_EVIDENCE_DIRECTORY/cms-cloudflare-build.log" 2>&1
      - name: Compiled CMS first request under local native workerd only
        env:
          GAGA_CMS_RUNTIME_CONFIG: cms/dist-editorial-cloudflare/server/wrangler.json
        run: |
          node tools/cms/runtime-proof.mjs
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.json" "$GAGA_EVIDENCE_DIRECTORY/studio-runtime.json"
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.log" "$GAGA_EVIDENCE_DIRECTORY/studio-runtime.log"
      - name: Compile production CMS from the same public native plugin, no deployment
        working-directory: cms
        run: npm run build:cloudflare > "$GAGA_EVIDENCE_DIRECTORY/production-cms-build.log" 2>&1
      - name: Production CMS artifact startup under native local workerd
        run: |
          node tools/cms/runtime-proof.mjs
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.json" "$GAGA_EVIDENCE_DIRECTORY/production-cms-runtime.json"
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.log" "$GAGA_EVIDENCE_DIRECTORY/production-cms-runtime.log"
      - name: Official EmDash bytes after all compilation and local runtime tests
        run: python3 tools/editorial/upstream-integrity.py
      - name: Zero-vulnerability dependency audit
        run: |
          npm audit --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/audit.json"
          npm audit --prefix cms --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/cms-audit.json"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Workflow lint and no generated tracked changes
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/editorial-studio.yml
          git diff --exit-code
      - name: Seal publication candidate; no deployment
        env:
          GAGA_PRODUCTION_QUALIFICATION: "1"
        run: node tools/gaga/deployment-manifest.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qualified-rich-publication-artifact
          path: |
            dist
            worker/bundle.mjs
            wrangler.jsonc
            .gaga/deployment-manifest.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Seal exact CMS artifact and reusable controller/input scope
        run: node tools/editorial/cms-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qualified-rich-cms-artifact
          path: |
            cms/dist-cloudflare
            .gaga/cms-qualified.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve sanitized reports and screenshots; no databases or sessions
        if: always()
        run: |
          node --input-type=module <<'JS'
          import{existsSync,readdirSync,copyFileSync}from'node:fs';
          const out=process.env.GAGA_EVIDENCE_DIRECTORY;if(!out)process.exit(0);
          if(existsSync('.gaga/editorial'))for(const name of readdirSync('.gaga/editorial'))if(/\.(json|png)$/.test(name)&&name!=='seed.json')copyFileSync('.gaga/editorial/'+name,out+'/'+name);
          if(existsSync('.gaga/browser-results.json'))copyFileSync('.gaga/browser-results.json',out+'/blog-browser-results.json');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-editorial-studio-evidence
          path: ${{ runner.temp }}/editorial-evidence
          if-no-files-found: error

  production:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["production-preflight","production-backup","deploy-cms"]'), inputs.operation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Locked public tools and external evidence
        run: |
          printf 'GAGA_EVIDENCE_DIRECTORY=%s/rich-production\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rich-production"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Admit the exact qualified artifact without rebuilding
        if: inputs.operation == 'deploy-cms' || inputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          CMS_ARTIFACT_ID: ${{ inputs.artifact_id }}
          CMS_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          CMS_ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          GAGA_EXPECTED_PRODUCTION_STATE: ${{ inputs.expected_state }}
        run: python3 tools/editorial/admit-cms-artifact.py
      - name: Recheck admitted production content with the unchanged read-only PAT
        env:
          CMS_ORIGIN: ${{ vars.CMS_ORIGIN }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: node tools/cms/refresh.mjs --check
      - name: Bounded provider operation; no publication Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATION: ${{ inputs.operation }}
          GAGA_EXPECTED_PRODUCTION_STATE: ${{ inputs.expected_state }}
          GAGA_CONTENT_RELEASE_ENABLED: ${{ vars.GAGA_CONTENT_RELEASE_ENABLED }}
          GAGA_EDITORIAL_FREEZE_CONFIRMED: ${{ inputs.freeze_confirmed }}
          GAGA_CMS_ARTIFACT_ADMISSION: ${{ runner.temp }}/rich-production/artifact-admission.json
        run: |
          case "$OPERATION" in
            production-preflight) node tools/editorial/production-control.mjs inspect ;;
            production-backup) node tools/editorial/production-control.mjs backup ;;
            deploy-cms) node tools/editorial/production-control.mjs deploy-cms ;;
            *) exit 1 ;;
          esac
      - name: Read-only post-operation production content admission
        if: success()
        env:
          CMS_ORIGIN: ${{ vars.CMS_ORIGIN }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: node tools/cms/refresh.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-production-evidence
          path: |
            ${{ runner.temp }}/rich-production/production-*.json
            ${{ runner.temp }}/rich-production/artifact-admission.json
            ${{ runner.temp }}/rich-production/cms-*.log
          if-no-files-found: warn
