name: Rich Editorial Studio
on:
  push:
    branches: [review/rich-editorial-studio-v1]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: qualify
        options: [qualify, admission-check, production-preflight, production-backup, deploy-cms]
      qualification_run:
        type: string
        description: Exact successful qualification run for CMS upload
      artifact_id:
        type: string
        description: Optional immutable prequalified CMS artifact ID
      artifact_sha256:
        type: string
        description: Exact prequalified ZIP digest, required with artifact_id
      artifact_source:
        type: string
        description: Immutable CMS source commit, required with artifact_id
      expected_state:
        type: string
        description: Exact expected current CMS and publication versions as JSON
      freeze_confirmed:
        type: boolean
        default: false
        description: Operator edits paused and production workflows frozen
permissions:
  contents: read
concurrency:
  group: editorial-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    if: inputs.operation == 'admission-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Only changed admission paths and existing zero-side-effect deployment guards
        run: node --test tools/cms/export.test.mjs tools/editorial/production-control.test.mjs tools/editorial/admission.test.mjs tools/gaga/production-deploy.test.mjs
      - name: Maintained deployment workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/deploy.yml .github/workflows/editorial-studio.yml
  verify:
    if: github.event_name == 'push' || inputs.operation == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      ASTRO_DEV_BACKGROUND: "1"
      WRANGLER_SEND_METRICS: "false"
      PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Clean locked public dependencies; external evidence only
        run: |
          mkdir -p "$RUNNER_TEMP/editorial-evidence"
          printf 'GAGA_EVIDENCE_DIRECTORY=%s/editorial-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Official EmDash bytes and public extension boundary
        run: python3 tools/editorial/upstream-integrity.py | tee "$GAGA_EVIDENCE_DIRECTORY/upstream.log"
      - name: Rich model, boundary, CMS, GAGA and signature regressions
        run: |
          npm run test:editorial | tee "$GAGA_EVIDENCE_DIRECTORY/editorial-tests.log"
          npm run test:gaga | tee "$GAGA_EVIDENCE_DIRECTORY/gaga-tests.log"
          npm run test:cms | tee "$GAGA_EVIDENCE_DIRECTORY/cms-tests.log"
          npm test | tee "$GAGA_EVIDENCE_DIRECTORY/signature-tests.log"
          node tools/gaga/preservation.mjs
          node tools/gaga/boundaries.mjs
      - name: Deterministic conversion and native seed admission
        run: |
          npm run editorial:prepare
          cd cms
          node node_modules/emdash/dist/cli/index.mjs seed ../.gaga/editorial/seed.json --validate
      - name: Current production cutover plan admission
        run: node tools/editorial/cutover-plan.mjs
      - name: Strict application and CMS TypeScript
        run: |
          npx tsc --noEmit -p cms/tsconfig.json
          npm run check | tee "$GAGA_EVIDENCE_DIRECTORY/types.log"
      - name: Publication build and public-package Search/Starlight/workerd proof
        run: |
          PUBLIC_BUILD_TIME="$(git show -s --format=%cI HEAD)" npm run build | tee "$GAGA_EVIDENCE_DIRECTORY/build.log"
          npm run test:consumer | tee "$GAGA_EVIDENCE_DIRECTORY/consumer.log"
      - name: Native editor, persistence, media, revisions and real PAKRPP preview
        run: |
          npx playwright install --with-deps chromium
          npm run test:editorial:ui | tee "$GAGA_EVIDENCE_DIRECTORY/studio-browser.log"
          npm run test:ui | tee "$GAGA_EVIDENCE_DIRECTORY/blog-browser.log"
      - name: Compile CMS studio with Cloudflare adapter, no credentials or deployment
        working-directory: cms
        run: npx astro build --root ./studio --config ../astro.studio.cloudflare.config.mjs > "$GAGA_EVIDENCE_DIRECTORY/cms-cloudflare-build.log" 2>&1
      - name: Compiled CMS first request under local native workerd only
        env:
          GAGA_CMS_RUNTIME_CONFIG: cms/dist-editorial-cloudflare/server/wrangler.json
        run: |
          node tools/cms/runtime-proof.mjs
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.json" "$GAGA_EVIDENCE_DIRECTORY/studio-runtime.json"
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.log" "$GAGA_EVIDENCE_DIRECTORY/studio-runtime.log"
      - name: Compile production CMS from the same public native plugin, no deployment
        working-directory: cms
        run: npm run build:cloudflare > "$GAGA_EVIDENCE_DIRECTORY/production-cms-build.log" 2>&1
      - name: Production CMS artifact startup under native local workerd
        run: |
          node tools/cms/runtime-proof.mjs
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.json" "$GAGA_EVIDENCE_DIRECTORY/production-cms-runtime.json"
          cp "$GAGA_EVIDENCE_DIRECTORY/runtime.log" "$GAGA_EVIDENCE_DIRECTORY/production-cms-runtime.log"
      - name: Official EmDash bytes after all compilation and local runtime tests
        run: python3 tools/editorial/upstream-integrity.py
      - name: Zero-vulnerability dependency audit
        run: |
          npm audit --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/audit.json"
          npm audit --prefix cms --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/cms-audit.json"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Workflow lint and no generated tracked changes
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/editorial-studio.yml
          git diff --exit-code
      - name: Seal publication candidate; no deployment
        env:
          GAGA_PRODUCTION_QUALIFICATION: "1"
        run: node tools/gaga/deployment-manifest.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qualified-rich-publication-artifact
          path: |
            dist
            worker/bundle.mjs
            wrangler.jsonc
            .gaga/deployment-manifest.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Seal exact CMS artifact and reusable controller/input scope
        run: node tools/editorial/cms-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qualified-rich-cms-artifact
          path: |
            cms/dist-cloudflare
            .gaga/cms-qualified.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve sanitized reports and screenshots; no databases or sessions
        if: always()
        run: |
          node --input-type=module <<'JS'
          import{existsSync,readdirSync,copyFileSync}from'node:fs';
          const out=process.env.GAGA_EVIDENCE_DIRECTORY;if(!out)process.exit(0);
          if(existsSync('.gaga/editorial'))for(const name of readdirSync('.gaga/editorial'))if(/\.(json|png)$/.test(name)&&name!=='seed.json')copyFileSync('.gaga/editorial/'+name,out+'/'+name);
          if(existsSync('.gaga/browser-results.json'))copyFileSync('.gaga/browser-results.json',out+'/blog-browser-results.json');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-editorial-studio-evidence
          path: ${{ runner.temp }}/editorial-evidence
          if-no-files-found: error

  production:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["production-preflight","production-backup","deploy-cms"]'), inputs.operation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Locked public tools and external evidence
        run: |
          printf 'GAGA_EVIDENCE_DIRECTORY=%s/rich-production\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rich-production"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
      - name: Admit the exact qualified artifact without rebuilding
        if: inputs.operation == 'deploy-cms' || inputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          CMS_ARTIFACT_ID: ${{ inputs.artifact_id }}
          CMS_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          CMS_ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
          GAGA_EXPECTED_PRODUCTION_STATE: ${{ inputs.expected_state }}
        run: python3 tools/editorial/admit-cms-artifact.py
      - name: Recheck admitted production content with the unchanged read-only PAT
        env:
          CMS_ORIGIN: ${{ vars.CMS_ORIGIN }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: node tools/cms/refresh.mjs --check
      - name: Bounded provider operation; no publication Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATION: ${{ inputs.operation }}
          GAGA_EXPECTED_PRODUCTION_STATE: ${{ inputs.expected_state }}
          GAGA_CONTENT_RELEASE_ENABLED: ${{ vars.GAGA_CONTENT_RELEASE_ENABLED }}
          GAGA_EDITORIAL_FREEZE_CONFIRMED: ${{ inputs.freeze_confirmed }}
          GAGA_CMS_ARTIFACT_ADMISSION: ${{ runner.temp }}/rich-production/artifact-admission.json
        run: |
          case "$OPERATION" in
            production-preflight) node tools/editorial/production-control.mjs inspect ;;
            production-backup) node tools/editorial/production-control.mjs backup ;;
            deploy-cms) node tools/editorial/production-control.mjs deploy-cms ;;
            *) exit 1 ;;
          esac
      - name: Read-only post-operation production content admission
        if: success()
        env:
          CMS_ORIGIN: ${{ vars.CMS_ORIGIN }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: node tools/cms/refresh.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-production-evidence
          path: |
            ${{ runner.temp }}/rich-production/production-*.json
            ${{ runner.temp }}/rich-production/artifact-admission.json
            ${{ runner.temp }}/rich-production/cms-*.log
          if-no-files-found: warn
