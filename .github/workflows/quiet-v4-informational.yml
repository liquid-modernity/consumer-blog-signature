name: Quiet V4 independent diagnostics
on:
  push:
    branches: [review/quiet-editorial-iteration-v1]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  preservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing preservation admission remains mandatory
        run: node tools/gaga/boundaries.mjs && node tools/gaga/preservation.mjs
  focused-reentry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tools/quiet-v4/playwright.config.mjs
      - name: Existing source-budget policy
        if: ${{ !cancelled() }}
        run: node tools/audit-policy-source.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quiet-v4-reentry-focused
          path: |
            .gaga/quiet-v4-focused.json
            .gaga/quiet-v4-focused-traces
            tools/quiet-v4/.gaga/quiet-v4-focused.json
            tools/quiet-v4/.gaga/quiet-v4-focused-traces
            .gaga/quiet-v4-*.png
          if-no-files-found: warn
  diagnostics:
    needs: [focused-reentry]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ASTRO_DEV_BACKGROUND: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Clean committed lock installation and provenance
        run: |
          mkdir -p "$RUNNER_TEMP/quiet-v4"
          node -v | tee "$RUNNER_TEMP/quiet-v4/node.txt"
          npm -v | tee "$RUNNER_TEMP/quiet-v4/npm.txt"
          uname -a | tee "$RUNNER_TEMP/quiet-v4/system.txt"
          sha256sum package-lock.json | tee "$RUNNER_TEMP/quiet-v4/lock.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/quiet-v4/source.txt"
          npm ci --ignore-scripts --no-audit --no-fund | tee "$RUNNER_TEMP/quiet-v4/install.txt"
      - name: Types and production build
        id: build
        run: |
          npm run check | tee "$RUNNER_TEMP/quiet-v4/check.txt"
          npm run build | tee "$RUNNER_TEMP/quiet-v4/build.txt"
      - name: Public packages, consumer, search and native runtime
        run: npm run test:consumer | tee "$RUNNER_TEMP/quiet-v4/consumer.txt"
      - run: npx playwright install --with-deps chromium webkit
      - name: Mandatory browser suite
        run: npm run test:ui | tee "$RUNNER_TEMP/quiet-v4/browser.txt"
      - name: Existing hierarchy browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright test --config tools/hierarchy/playwright.config.mjs | tee "$RUNNER_TEMP/quiet-v4/hierarchy-browser.txt"
          node tools/hierarchy/browser-report.mjs
      - name: Existing navigation browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright test --config tools/navigation/playwright.config.mjs | tee "$RUNNER_TEMP/quiet-v4/navigation-browser.txt"
          node tools/navigation/browser-report.mjs
      - name: Existing device browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright test --config tools/device/playwright.config.mjs | tee "$RUNNER_TEMP/quiet-v4/device-browser.txt"
          node tools/device/browser-report.mjs
      - name: Existing family browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright test --config tools/family/playwright.config.mjs | tee "$RUNNER_TEMP/quiet-v4/family-browser.txt"
          node tools/family/browser-report.mjs
      - name: Existing share browser suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx --no-install playwright test --config tools/share/playwright.config.mjs | tee "$RUNNER_TEMP/quiet-v4/share-browser.txt"
          node tools/share/browser-report.mjs
      - name: Existing application, CMS and signature regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm run test:gaga | tee "$RUNNER_TEMP/quiet-v4/gaga.txt"
          npm run test:cms | tee "$RUNNER_TEMP/quiet-v4/cms.txt"
          npm test | tee "$RUNNER_TEMP/quiet-v4/signature.txt"
      - name: Preserve informational diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quiet-v4-independent-diagnostics
          path: ${{ runner.temp }}/quiet-v4
          if-no-files-found: error
