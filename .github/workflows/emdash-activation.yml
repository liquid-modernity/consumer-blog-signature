name: EmDash local activation and production preflight
on:
  push:
    branches: [review/emdash-local-activation]
    paths-ignore: [tools/cms/deploy.mjs, tools/cms/deploy.test.mjs, tools/cms/repair-artifact*, .github/workflows/emdash-activation.yml]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: validate
        options: [validate, provider-preflight, credential-preflight, provision, deploy-cms, repair-cms]
        description: Validation has no provider access; credential and provider preflights are read-only
      diagnostic_public_key:
        type: string
        description: Operator RSA public PEM; detailed credential evidence is encrypted

permissions:
  contents: read
concurrency:
  group: emdash-activation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cms:
    if: github.event_name == 'push' || inputs.operation == 'validate' || inputs.operation == 'provision' || inputs.operation == 'deploy-cms'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Clean public application and CMS dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/emdash-evidence"
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix cms ci --ignore-scripts --no-audit --no-fund
      - name: Migration admission and original application boundaries
        run: |
          npm run test:cms | tee "$RUNNER_TEMP/emdash-evidence/migration-tests.log"
          node tools/gaga/preservation.mjs
          node tools/gaga/boundaries.mjs
          cd cms
          node node_modules/emdash/dist/cli/index.mjs seed --validate > "$RUNNER_TEMP/emdash-evidence/seed-validation.log" 2>&1
      - name: Real CMS server build
        run: npm --prefix cms run build > "$RUNNER_TEMP/emdash-evidence/cms-build.log" 2>&1
      - name: Separate production CMS Worker build, no deployment
        run: npm --prefix cms run build:cloudflare > "$RUNNER_TEMP/emdash-evidence/cms-cloudflare-build.log" 2>&1
      - name: Compiled CMS startup under local native workerd, no provider access
        env:
          GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/emdash-evidence/cms-runtime
        run: node tools/cms/runtime-proof.mjs
      - name: Actual blog through the admitted real CMS export
        env:
          GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/emdash-evidence/blog
        run: |
          mkdir -p "$GAGA_EVIDENCE_DIRECTORY"
          npm run verify > "$RUNNER_TEMP/emdash-evidence/blog.log" 2>&1
      - name: CMS dependency audit
        run: npm --prefix cms audit --audit-level=low --json > "$RUNNER_TEMP/emdash-evidence/cms-audit.json"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Maintained workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/emdash-activation.yml
      - name: Source unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emdash-preparation-evidence
          path: ${{ runner.temp }}/emdash-evidence
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cms-worker-candidate
          path: cms/dist-cloudflare
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    needs: cms
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-cms' && needs.cms.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm --prefix cms ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: cms-worker-candidate
          path: cms/dist-cloudflare
      - name: Admit exact stores and deploy only the dedicated CMS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/cms-deployment
        run: node tools/cms/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-deployment-evidence
          path: ${{ runner.temp }}/cms-deployment
          include-hidden-files: true
  provider:
    needs: cms
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.operation == 'provider-preflight' || (inputs.operation == 'provision' && needs.cms.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Existing credential, whole-set admission and bounded empty-store provisioning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/provider-evidence
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = provision ]; then
            node tools/cms/provider.mjs provision
          else
            node tools/cms/provider.mjs preflight
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emdash-provider-evidence
          path: ${{ runner.temp }}/provider-evidence
  credential:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'credential-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Read-only User and Account token ownership and policy inspection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.diagnostic_public_key }}
          GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/credential-evidence
        run: node tools/cms/credential-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emdash-credential-diagnostic-encrypted
          path: ${{ runner.temp }}/credential-evidence

  repair:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'repair-cms'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GAGA_EVIDENCE_DIRECTORY: ${{ runner.temp }}/cms-repair
      CMS_REPAIR_ADMISSION: ${{ runner.temp }}/cms-repair/artifact-admission.json
      CMS_REPAIR_SOURCE: df3c022368726f07545f1736184ea77fe24ce5cf
      CMS_REPAIR_ARTIFACT_SHA256: e063e7ff2dec9c8212ff883e1d1e164ce4df5ca8e4b8fab7fb1d48bb57c2b518
      CMS_REPAIR_EXPECTED_VERSION: 3b493d27-84ee-47b9-a2f3-2ebd4794dadb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Repair guard regressions and unchanged qualified CMS source
        run: |
          node --test tools/cms/deploy.test.mjs
          python3 tools/cms/repair-artifact.test.py
          git diff --exit-code "$CMS_REPAIR_SOURCE" HEAD -- cms package.json package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/emdash-activation.yml
      - name: Admit exact successful-run artifact without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cms/repair-artifact.py
      - name: Install pinned deployment tooling only, no build scripts
        run: npm --prefix cms ci --ignore-scripts --no-audit --no-fund
      - name: Read-only production version, bindings and fresh D1 admission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_REPAIR_PHASE: preflight
        run: node tools/cms/deploy.mjs
      - name: Preserve rollback and pre-deployment receipt before mutation
        uses: actions/upload-artifact@v4
        with:
          name: cms-repair-predeployment
          path: |
            ${{ runner.temp }}/cms-repair/artifact-admission.json
            ${{ runner.temp }}/cms-repair/pre-deployment.json
            ${{ runner.temp }}/cms-repair/dry-run.log
          if-no-files-found: error
      - name: Recheck admission, update once, initialize and verify only CMS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_REPAIR_PHASE: update
        run: node tools/cms/deploy.mjs
      - name: Preserve sanitized repair receipt and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-repair-evidence
          path: |
            ${{ runner.temp }}/cms-repair/artifact-admission.json
            ${{ runner.temp }}/cms-repair/pre-deployment.json
            ${{ runner.temp }}/cms-repair/deployment.json
            ${{ runner.temp }}/cms-repair/dry-run.log
            ${{ runner.temp }}/cms-repair/deploy.log
          if-no-files-found: warn
