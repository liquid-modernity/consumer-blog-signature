name: Universal release production verification
on:
  push:
    branches: [verification/universal-release-system-v1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: universal-release-read-only-proof
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pinned Garrison controller
        uses: actions/checkout@v4
        with:
          repository: liquid-modernity/gaga-garrison
          ref: 6cb5483bf0ac3655be300df9c7b308ffddfa51d3
          token: ${{ secrets.GAGA_CONTROLLER_READ_TOKEN }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm ci --prefix controller --ignore-scripts --no-audit --no-fund
      - name: Resolve immutable candidate from the manifest
        id: candidate
        run: |
          node controller/release/control.mjs describe controller/release/manifests/consumer-blog-signature.json > "$RUNNER_TEMP/release-source.json"
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/release-source.json'));
          appendFileSync(process.env.GITHUB_OUTPUT,`repository=${x.repository}\ncommit=${x.commit}\n`);
          JS
      - name: Check out exact qualified candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.candidate.outputs.repository }}
          ref: ${{ steps.candidate.outputs.commit }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Controller regressions
        run: npm test --prefix controller
      - name: Dependency audit
        run: npm audit --prefix controller --omit=dev --audit-level=low
      - name: Lint maintained Garrison workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= controller/.github/workflows/universal-release.yml
      - name: Independently verify current production, without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: |
          node controller/release/control.mjs verify controller/release/manifests/consumer-blog-signature.json \
            --source "$GITHUB_WORKSPACE/candidate" \
            --cache "$RUNNER_TEMP/gaga-release-cache" \
            --receipt "$RUNNER_TEMP/gaga-release/receipt.json"
      - name: Assert canonical receipt and zero production mutations
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/gaga-release/receipt.json'));
          assert.equal(r.status,'VERIFIED');
          for(const field of ['attempts','uploads','resourceCreates','contentWrites','schemaWrites'])assert.equal(r.deployment[field],0);
          assert.equal(r.deployment.transport.mutatingRequests,0);
          assert.deepEqual(r.actualState,r.expectedState);
          assert.equal(r.content.records.length,8);
          assert.ok(r.readback.publicFiles.length>100);
          assert.ok(Array.isArray(r.readback.http)&&r.readback.http.length>0);
          assert.ok(r.readback.http.every(c=>c.anonymous===true));
          console.log(JSON.stringify({status:r.status,manifestDigest:r.manifestDigest,source:r.source.commit,production:r.actualState,contentRecords:r.content.records.length,publicFiles:r.readback.publicFiles.length,mutatingRequests:0}));
          JS
      - name: Preserve one canonical release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-release-receipt
          path: ${{ runner.temp }}/gaga-release/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve redacted failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: universal-release-diagnostics
          path: ${{ runner.temp }}/gaga-release-cache/diagnostic.log
          if-no-files-found: ignore
          retention-days: 30
