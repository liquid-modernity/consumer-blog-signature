name: Editorial consumer qualification
on:
  push:
    branches: [review/arsenal-020-registry-adoption-v1, review/editorial-studio-uiux-v1]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ASTRO_DEV_BACKGROUND: '1'
      WRANGLER_SEND_METRICS: 'false'
      GAGA_CONTENT_RELEASE_ENABLED: 'false'
      PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Exact runtime and external evidence
        run: |
          npm install --global npm@10.9.3 --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/registry-adoption/evidence"
          echo "GAGA_EVIDENCE_DIRECTORY=$RUNNER_TEMP/registry-adoption/evidence" >> "$GITHUB_ENV"
          node --version
          npm --version
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          writeFileSync(process.env.RUNNER_TEMP+'/registry-adoption/evidence/runner.json',JSON.stringify({node:process.version,npm:execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),runner:process.env.RUNNER_OS,image:process.env.ImageOS,imageVersion:process.env.ImageVersion,source:process.env.GITHUB_SHA}));
          JS
      - name: Clean committed-lock installs and official registry admission
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
          node tools/gaga/boundaries.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/boundaries.log"
      - name: Directly affected equivalence, CMS, preview and Search regressions
        run: |
          node --test tools/editorial/portable-text.test.mjs tools/editorial/semantics-boundary.test.mjs tools/editorial/plugin.test.mjs tools/editorial/boundaries.test.mjs tools/content/content.test.mjs tools/content/approval.test.mjs tools/gaga/application.test.mjs tools/gaga/registry-adoption.test.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/tests.log"
          npm test | tee "$GAGA_EVIDENCE_DIRECTORY/signature.log"
          node tools/gaga/preservation.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/preservation.log"
      - name: Strict app and CMS typing; actual publication and CMS compilation
        run: |
          node node_modules/typescript/bin/tsc --project cms/tsconfig.json --noEmit > "$GAGA_EVIDENCE_DIRECTORY/cms-types.log" 2>&1
          npm run check | tee "$GAGA_EVIDENCE_DIRECTORY/types.log"
          PUBLIC_BUILD_TIME="$(git show -s --format=%cI HEAD)" npm run build | tee "$GAGA_EVIDENCE_DIRECTORY/build.log"
          npm run build:cloudflare --prefix cms | tee "$GAGA_EVIDENCE_DIRECTORY/cms-build.log"
      - name: Actual Starlight and native publication Search; local compiled CMS startup
        run: |
          node tools/gaga/consumer.mjs > "$GAGA_EVIDENCE_DIRECTORY/consumer.log" 2>&1
          node tools/cms/runtime-proof.mjs
      - name: Local native editor, presentation, private preview and responsive regressions
        run: |
          npm run editorial:prepare
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test --config playwright.editorial.config.ts integration.spec.ts quality.spec.ts --grep-invert '^Orca announces' | tee "$GAGA_EVIDENCE_DIRECTORY/browser.log"
          cp .gaga/editorial/browser-results.json .gaga/editorial/packed-integration.json .gaga/editorial/packed-integration.png "$GAGA_EVIDENCE_DIRECTORY/"
          # One independent headed AT smoke; functional cases stay on the established headless path.
          # Ephemeral runner tools only; no application dependency or lock changes.
          sudo apt-get update -qq
          sudo apt-get install -y orca dbus-x11 pulseaudio speech-dispatcher-espeak-ng
          cat > "$RUNNER_TEMP/editorial-screen-reader.sh" <<'SH'
          set -euo pipefail
          export NO_AT_BRIDGE=0
          export GAGA_EDITORIAL_SCREEN_READER=orca
          export GAGA_ORCA_LOG="$GAGA_EVIDENCE_DIRECTORY/orca-debug.log"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=editorial-proof > "$GAGA_EVIDENCE_DIRECTORY/audio-sink.txt"
          speech-dispatcher -d
          gsettings set org.gnome.desktop.a11y.applications screen-reader-enabled true
          mkdir -p "$RUNNER_TEMP/orca-prefs"
          orca --version > "$GAGA_EVIDENCE_DIRECTORY/orca-version.txt"
          orca --replace --enable=speech --disable=braille --debug --debug-file="$GAGA_ORCA_LOG" -u "$RUNNER_TEMP/orca-prefs" > "$GAGA_EVIDENCE_DIRECTORY/orca-process.log" 2>&1 &
          orca_pid=$!
          trap 'kill "$orca_pid" 2>/dev/null || true' EXIT
          npx --no-install playwright test --config playwright.editorial.config.ts quality.spec.ts --grep '^Orca announces' | tee "$GAGA_EVIDENCE_DIRECTORY/screen-reader.log"
          cp .gaga/editorial/browser-results.json "$GAGA_EVIDENCE_DIRECTORY/screen-reader-results.json"
          SH
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1440x24' bash "$RUNNER_TEMP/editorial-screen-reader.sh"
      - name: Preserve isolated editor screenshots and diagnostics
        if: always()
        run: |
          mkdir -p "$GAGA_EVIDENCE_DIRECTORY/editorial"
          if [ -d .gaga/editorial ]; then cp -R .gaga/editorial/. "$GAGA_EVIDENCE_DIRECTORY/editorial/"; fi
          if [ -d test-results ]; then cp -R test-results "$GAGA_EVIDENCE_DIRECTORY/editorial/"; fi
      - name: Existing desktop and mobile publication browser regressions
        run: |
          npm run test:ui | tee "$GAGA_EVIDENCE_DIRECTORY/publication-browser.log"
          cp .gaga/browser-results.json "$GAGA_EVIDENCE_DIRECTORY/publication-browser-results.json"
      - name: Workflow lint, dependency audit and unchanged protected state
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/editorial-integration.yml
          npm audit --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/audit.json"
          npm audit --prefix cms --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/cms-audit.json"
          cp package-lock.json "$GAGA_EVIDENCE_DIRECTORY/application-package-lock.json"
          cp cms/package-lock.json "$GAGA_EVIDENCE_DIRECTORY/cms-package-lock.json"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Canonical qualification receipt
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {sourceIdentity} from './tools/gaga/source-identity.mjs';
          const dir=process.env.GAGA_EVIDENCE_DIRECTORY,read=name=>JSON.parse(readFileSync(dir+'/'+name));
          const equivalence=read('semantics-equivalence.json'),consumer=read('consumer-receipt.json'),cms=read('runtime.json');
          const runner=read('runner.json');assert.equal(runner.node,'v22.23.4');assert.equal(runner.npm,'10.9.3');
          const tests=readFileSync(dir+'/tests.log','utf8');assert.match(tests,/# fail 0\b/);assert.match(tests,/# skipped 0\b/);
          assert.equal(equivalence.records.length,8);assert.equal(consumer.status,'PASS');assert.equal(cms.status,'PASS');
          assert.equal(read('packed-integration.json').status,'PASS');assert.equal(read('browser-results.json').stats.unexpected,0);
          const editorBrowser=read('browser-results.json');assert.equal(editorBrowser.stats.expected,9);
          for(const file of ['editing','saved-preview','responsive','rich-media'])assert.equal(read('editorial/quality/'+file+'.json').status,'PASS');
          const a11y=read('editorial/quality/accessibility.json');assert.equal(a11y.status,'APP_CONTROLS_PASS_NATIVE_ISSUES_RETAINED');assert.equal(a11y.screenReaderSession,'SEPARATE_ORCA_SMOKE');
          const sr=read('screen-reader-results.json');assert.equal(sr.stats.expected,1);assert.equal(sr.stats.unexpected,0);assert.equal(sr.stats.skipped,0);assert.equal(sr.stats.flaky,0);assert.equal(read('editorial/quality/screen-reader.json').status,'PASS');
          const publicationBrowser=read('publication-browser-results.json');assert.equal(publicationBrowser.stats.expected,4);assert.equal(publicationBrowser.stats.unexpected,0);
          for(const browser of [read('browser-results.json'),publicationBrowser]){assert.equal(browser.stats.skipped,0);assert.equal(browser.stats.flaky,0);}
          for(const audit of ['audit.json','cms-audit.json'])assert.equal(read(audit).metadata.vulnerabilities.total,0);
          const digest=path=>createHash('sha256').update(readFileSync(path)).digest('hex');
          // Scope is presentation/tests/docs plus this existing qualification entrypoint.
          const allowed=new Set(['cms/editorial/admin.tsx','cms/editorial/studio.css','docs/RICH-EDITORIAL-STUDIO.md','tools/editorial/browser/integration.spec.ts','tools/editorial/browser/quality.spec.ts','tools/editorial/browser/studio.spec.ts','playwright.editorial.config.ts','.github/workflows/editorial-integration.yml']);
          const changed=execFileSync('git',['diff','--name-only','c346617df851916a69167b62924bbc5b419c5c56','HEAD'],{encoding:'utf8'}).trim().split('\n');assert.ok(changed.every(file=>allowed.has(file)));
          const client=execFileSync('find',['cms/dist-cloudflare/client','-name','*.js'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).map(file=>readFileSync(file,'utf8')).join('\n');
          assert.ok(!client.includes('Start the application on localhost:3000'),'Production client must eliminate developer preview instructions');
          assert.equal(digest('package-lock.json'),'5eaf8946c85601681837807ac2bca5c8d4547bd784014dd7dab07d44e3e8b9ee');
          // Exact output identities from qualified integration run 40488444126.
          assert.equal(digest('dist/search-index.json'),'5b982d6827606ed194604511f83156cb0697c04115df253177581df24ce6a807');
          assert.equal(digest('.gaga/composition-plan.json'),'9bcb42ad793a612b9322c81cac78d64a680ee51d779dbd65ab908c6375eda7c7');
          assert.equal(digest('cms/package-lock.json'),'62b398d8c74d91f0fa4b5c1c40818737c225e574aecbe14637fd6f86c4c2eef5');
          assert.equal(process.env.GAGA_CONTENT_RELEASE_ENABLED,'false');
          const receipt={schema:'gaga.editorial-uiux-qualification/v1',status:'QUALIFIED',source:sourceIdentity(),baseline:'c346617df851916a69167b62924bbc5b419c5c56',changedFiles:changed,editorBrowserCases:editorBrowser.stats.expected,accessibility:a11y,semanticOracle:equivalence.baseline,arsenal:consumer.arsenal,registry:consumer.registry,runner,workerd:execFileSync('node_modules/.bin/workerd',['--version'],{encoding:'utf8'}).trim(),lockSha256:digest('package-lock.json'),cmsLockSha256:digest('cms/package-lock.json'),exportSha256:equivalence.exportSha256,searchArtifactsSha256:digest('dist/search-index.json'),compositionPlanSha256:digest('.gaga/composition-plan.json'),checks:{tests:Number(tests.match(/# pass (\d+)/)[1]),failed:0,skipped:0,records:8,signature:'PASS',strictApplicationTypes:'PASS',strictCmsTypes:'PASS',publicationBuild:'PASS',cmsBuild:'PASS',nativeSearch:'PASS',cmsStartup:'PASS',starlight:'PASS',localEditorPreview:'PASS',publicationBrowser:{passed:4,failed:0,desktop:true,mobile:true},searchOutputIdentity:'UNCHANGED',compositionPlanIdentity:'UNCHANGED',reviewExceptionRemoved:true,productionGuard:'PASS',workflowLint:'PASS',audit:'PASS',cmsAudit:'PASS'},production:{contentWrites:0,schemaWrites:0,providerMutations:0,deployments:0,credentialChanges:0,publishUnpublishOperations:0,packagePublications:0,mainPromotions:0},run:process.env.GITHUB_RUN_ID};
          writeFileSync(dir+'/qualification-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arsenal-020-registry-adoption-evidence
          path: ${{ runner.temp }}/registry-adoption/evidence
          if-no-files-found: error
