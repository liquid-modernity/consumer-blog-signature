name: Packed Arsenal editorial consumer integration
on:
  push:
    branches: [review/editorial-consumer-integration-v1]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ASTRO_DEV_BACKGROUND: '1'
      WRANGLER_SEND_METRICS: 'false'
      GAGA_ARSENAL_EDITORIAL_REVIEW: '1'
      PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Exact runtime and external evidence
        run: |
          npm install --global npm@10.9.3 --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/editorial-integration/evidence"
          echo "GAGA_EVIDENCE_DIRECTORY=$RUNNER_TEMP/editorial-integration/evidence" >> "$GITHUB_ENV"
          node --version
          npm --version
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          writeFileSync(process.env.RUNNER_TEMP+'/editorial-integration/evidence/runner.json',JSON.stringify({node:process.version,npm:execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),runner:process.env.RUNNER_OS,image:process.env.ImageOS,imageVersion:process.env.ImageVersion,source:process.env.GITHUB_SHA}));
          JS
      - name: Clean committed-lock installs and actual packed-package admission
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cms --ignore-scripts --no-audit --no-fund
          node tools/gaga/editorial-review.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/package.json"
          node tools/gaga/boundaries.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/boundaries.log"
      - name: Directly affected equivalence, CMS, preview and Search regressions
        run: |
          node --test tools/editorial/portable-text.test.mjs tools/editorial/semantics-boundary.test.mjs tools/editorial/plugin.test.mjs tools/editorial/boundaries.test.mjs tools/content/content.test.mjs tools/gaga/application.test.mjs tools/gaga/editorial-review.test.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/tests.log"
          npm test | tee "$GAGA_EVIDENCE_DIRECTORY/signature.log"
          node tools/gaga/preservation.mjs | tee "$GAGA_EVIDENCE_DIRECTORY/preservation.log"
      - name: Strict app and CMS typing; actual publication and CMS compilation
        run: |
          node node_modules/typescript/bin/tsc --project cms/tsconfig.json --noEmit
          npm run check | tee "$GAGA_EVIDENCE_DIRECTORY/types.log"
          PUBLIC_BUILD_TIME="$(git show -s --format=%cI HEAD)" npm run build | tee "$GAGA_EVIDENCE_DIRECTORY/build.log"
          npm run build:cloudflare --prefix cms | tee "$GAGA_EVIDENCE_DIRECTORY/cms-build.log"
      - name: Actual Starlight and native publication Search; local compiled CMS startup
        run: |
          node tools/gaga/consumer.mjs > "$GAGA_EVIDENCE_DIRECTORY/consumer.log" 2>&1
          node tools/cms/runtime-proof.mjs
      - name: Local browser hydration, draft persistence and canonical preview
        run: |
          npm run editorial:prepare
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test --config playwright.editorial.config.ts integration.spec.ts | tee "$GAGA_EVIDENCE_DIRECTORY/browser.log"
          cp .gaga/editorial/browser-results.json .gaga/editorial/packed-integration.json .gaga/editorial/packed-integration.png "$GAGA_EVIDENCE_DIRECTORY/"
      - name: Workflow lint, dependency audit and unchanged protected state
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/editorial-integration.yml
          npm audit --audit-level=low --json > "$GAGA_EVIDENCE_DIRECTORY/audit.json"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Canonical qualification receipt
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {sourceIdentity} from './tools/gaga/source-identity.mjs';
          const dir=process.env.GAGA_EVIDENCE_DIRECTORY,read=name=>JSON.parse(readFileSync(dir+'/'+name));
          const equivalence=read('semantics-equivalence.json'),consumer=read('consumer-receipt.json'),cms=read('runtime.json');
          const runner=read('runner.json');assert.equal(runner.node,'v22.23.4');assert.equal(runner.npm,'10.9.3');
          const tests=readFileSync(dir+'/tests.log','utf8');assert.match(tests,/# fail 0\b/);assert.match(tests,/# skipped 0\b/);
          assert.equal(equivalence.records.length,8);assert.equal(consumer.status,'PASS');assert.equal(cms.status,'PASS');
          assert.equal(read('packed-integration.json').status,'PASS');assert.equal(read('browser-results.json').stats.unexpected,0);
          const digest=path=>createHash('sha256').update(readFileSync(path)).digest('hex');
          const receipt={schema:'gaga.arsenal-editorial-consumer-qualification/v1',status:'QUALIFIED',source:sourceIdentity(),baseline:equivalence.baseline,package:read('package.json'),runner,workerd:execFileSync('node_modules/.bin/workerd',['--version'],{encoding:'utf8'}).trim(),lockSha256:digest('package-lock.json'),cmsLockSha256:digest('cms/package-lock.json'),exportSha256:equivalence.exportSha256,searchArtifactsSha256:digest('dist/search-index.json'),compositionPlanSha256:digest('.gaga/composition-plan.json'),checks:{tests:Number(tests.match(/# pass (\d+)/)[1]),failed:0,skipped:0,records:8,signature:'PASS',strictApplicationTypes:'PASS',strictCmsTypes:'PASS',publicationBuild:'PASS',cmsBuild:'PASS',nativeSearch:'PASS',cmsStartup:'PASS',starlight:'PASS',localEditorPreview:'PASS',workflowLint:'PASS',audit:'PASS'},production:{contentWrites:0,schemaWrites:0,providerMutations:0,deployments:0,credentialChanges:0,publishUnpublishOperations:0,packagePublications:0,mainPromotions:0},run:process.env.GITHUB_RUN_ID};
          writeFileSync(dir+'/qualification-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arsenal-editorial-consumer-integration-evidence
          path: ${{ runner.temp }}/editorial-integration/evidence
          if-no-files-found: error
